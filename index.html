<body>

  <!-- Combined Script Imports on One Line -->
  <script src="lib/three.min.js"></script><script src="lib/stats.min.js"></script><script src="lib/SimplexNoise.js"></script><script src="lib/minivents.min.js"></script><script src="lib/TweenMax.m[...]


  <!-- UI Text & Clock -->
  <script>
    const messages = ["What","Why","Now","Really","Again","Seriously","Wait","Huh","Uh...","Nope","This?","That?","How","Who","Where","When","Which","Maybe","Oops","Bruh","Yo","Help","Pls","IDK","Hm",[...] 
    const punctuations = ["?","!","...","?!","!?","??","‽"];
    const btn = document.querySelector(".big-btn");
    if (btn) {
      const message = messages[Math.floor(Math.random() * messages.length)];
      const punct = punctuations[Math.floor(Math.random() * punctuations.length)];
      btn.textContent = message + punct;
    }

    function getRandomEmoji() {
      const ranges = [[0x1F600,0x1F64F],[0x1F300,0x1F5FF],[0x1F680,0x1F6FF],[0x2600,0x26FF],[0x2700,0x27BF]];
      const range = ranges[Math.floor(Math.random() * ranges.length)];
      const codePoint = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
      return String.fromCodePoint(codePoint);
    }

    function getRandomEmojis(count = 4) {
      let emojis = '';
      for (let i = 0; i < count; i++) emojis += getRandomEmoji() + ' ';
      return emojis.trim();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const p = document.getElementById('emoji-target');
      const emojis = getRandomEmojis(4);
      p.textContent = `${emojis} insanity later`;
    });

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      hours = hours % 12 || 12;
      const timeString = `${hours}:${minutes}:${seconds}`;
      document.getElementById('digital-clock').textContent = timeString;
    }

    setInterval(updateClock, 1000);
    updateClock();

    window.addEventListener("load", () => {
      setTimeout(() => {
        document.querySelector(".over").style.display = "none";
        document.getElementById("weather-btn").style.display = "none";
      }, 60000);
    });

    function updateTitleClock() {
      const now = new Date();
      let hours = now.getHours() % 12 || 12;
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const timeString = `${hours}:${minutes}`;
      const originalTitle = document.title.replace(/^\d{1,2}:\d{2} /, '');
      document.title = `${timeString} ${originalTitle}`;
    }

    setInterval(updateTitleClock, 30000);
    updateTitleClock();
  </script>

  <!-- Weather Script (Accurate hourly forecast fix) -->
  <script>
    const weatherBtn = document.getElementById('weather-btn');
    const weatherCodeToEmoji = {
      0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",
      51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",
      61:"🌦️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",
      71:"❄️",73:"❄️",75:"❄️",77:"🌨️",80:"🌧️",
      81:"🌧️",82:"🌧️",85:"❄️",86:"❄️",95:"⛈️",
      96:"⛈️",99:"⛈️"
    };

    async function getWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph&hourly=temperature_2m,weathercode&da[...]`
      try {
        const res = await fetch(url);
        const data = await res.json();

        // Current Weather
        const current = data.current_weather;
        const currentEmoji = weatherCodeToEmoji[current.weathercode] || "❓";
        weatherBtn.textContent = currentEmoji;
        document.getElementById('weather-current').innerHTML = `${currentEmoji} <strong>${current.temperature.toFixed(1)}°F</strong><br>💨 Wind: ${current.windspeed.toFixed(1)} mph<br>🧭 Dir[...]`

        // Hourly Forecast — NEXT 6 HOURS based on local time
        const hourlyHTML = [];
        const now = new Date();
        for (let i = 0, count = 0; i < data.hourly.time.length && count < 6; i++) {
          const time = new Date(data.hourly.time[i]);
          if (time > now) {
            const timeStr = time.toLocaleTimeString([], { hour: 'numeric', hour12: true });
            const temp = data.hourly.temperature_2m[i];
            const code = data.hourly.weathercode[i];
            const emoji = weatherCodeToEmoji[code] || "❓";
            hourlyHTML.push(`${timeStr}: ${emoji} ${temp.toFixed(1)}°F`);
            count++;
          }
        }
        document.getElementById('weather-hourly').innerHTML = `<strong>Next 6 Hours</strong><br>${hourlyHTML.join('<br>')}`;

        // Daily Forecast (Next 3 Days)
        const dailyHTML = [];
        for (let i = 0; i < 3; i++) {
          const date = new Date(data.daily.time[i]).toLocaleDateString(undefined, { weekday: 'short' });
          const tMin = data.daily.temperature_2m_min[i];
          const tMax = data.daily.temperature_2m_max[i];
          const code = data.daily.weathercode[i];
          const emoji = weatherCodeToEmoji[code] || "❓";
          dailyHTML.push(`${date}: ${emoji} ${Math.round(tMin)}–${Math.round(tMax)}°F`);
        }
        document.getElementById('weather-daily').innerHTML = `<strong>Next 3 Days</strong><br>${dailyHTML.join('<br>')}`;
      } catch (err) {
        console.error(err);
        document.getElementById('weather-current').textContent = '⚠️ Failed to get weather.';
      }
    }

    function fetchAndStoreLocation() {
      document.getElementById('weather-current').textContent = 'Requesting location...';
      navigator.geolocation.getCurrentPosition((position) => {
        const { latitude, longitude } = position.coords;
        localStorage.setItem("weather_lat", latitude);
        localStorage.setItem("weather_lon", longitude);
        getWeather(latitude, longitude);
      }, (error) => {
        console.error(error);
        document.getElementById('weather-current').textContent = '❌ Geolocation error.';
      });
    }

    weatherBtn.addEventListener('click', () => {
      document.getElementById('weather-info').style.display = 'block';
      const lat = localStorage.getItem("weather_lat");
      const lon = localStorage.getItem("weather_lon");
      if (lat && lon) getWeather(lat, lon);
      else fetchAndStoreLocation();
    });
  </script>

  <script>
    const pagesBtn = document.getElementById('pages-btn');
    const pagesPanel = document.getElementById('pages-panel');
    const pagesPanelClose = document.getElementById('pages-panel-close');
    if (pagesBtn && pagesPanel && pagesPanelClose) {
      pagesBtn.addEventListener('click', () => pagesPanel.classList.toggle('open'));
      pagesPanelClose.addEventListener('click', () => pagesPanel.classList.remove('open'));
    }
  </script>

  <!-- Dynamic pages list: fetch HTML files from this public repo via GitHub API -->
  <script>
    (async function loadPages() {
      const owner = 's-e-r-e-n-i-t-y';
      const repo = 's-e-r-e-n-i-t-y.github.io';
      const pagesList = document.getElementById('pages-list');
      if (!pagesList) return;

      // Show loading state
      pagesList.textContent = 'Loading pages...';

      // Helper to create a link element
      function makeLink(path) {
        const a = document.createElement('a');
        a.className = 'page-item';
        a.href = encodeURI('/' + path);
        // Show a nicer label: filename without extension and directory
        const label = path.replace(/^.*\//, '').replace(/\.html$/i, '');
        a.textContent = label;
        a.title = path;
        return a;
      }

      try {
        // Get default branch
        const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
        if (!repoRes.ok) throw new Error('Failed to fetch repo info');
        const repoData = await repoRes.json();
        const branch = repoData.default_branch || 'main';

        // Fetch tree recursively
        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (!treeRes.ok) throw new Error('Failed to fetch repo tree');
        const treeData = await treeRes.json();

        // Collect .html files (blobs) and filter out the current index and files you may want to hide
        const htmlFiles = (treeData.tree || [])
          .filter(item => item.type === 'blob' && item.path.match(/\.html$/i))
          .map(item => item.path)
          .filter(path => !path.match(/^\.well-known\//))
          .filter(path => !path.match(/^index\.html$/i)) // don't list the current index
          .filter(path => !path.match(/^404\.html$/i));

        // Sort and render
        htmlFiles.sort((a,b) => a.localeCompare(b, undefined, {sensitivity: 'base'}));
        pagesList.innerHTML = '';
        if (htmlFiles.length === 0) {
          pagesList.textContent = 'No pages found.';
        } else {
          htmlFiles.forEach(p => pagesList.appendChild(makeLink(p)));
        }
      } catch (err) {
        console.error('Failed to load pages list from GitHub API', err);
        // Fallback to a safe static list if API fails (keeps previous entries)
        const fallback = [
          'mash.html','music.html','hi.html','hls.html','shader.html','more.html','combined.html','combined_fixed.html','combined (1).html','not_found.html','index-neocities.html','local_shuffle_player (1).html','matrix-standalone.html','mixxy-standalone.html','sample-slicer.html'
        ];
        pagesList.innerHTML = '';
        fallback.forEach(p => pagesList.appendChild(makeLink(p)));
      }
    })();
  </script>
